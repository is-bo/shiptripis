# PostgreSQL 16; tested against the project's CI major version.
listen_addresses = '*'
max_connections = 100
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 192MB
max_wal_size = 2GB
min_wal_size = 256MB
wal_level = replica
fsync = on
full_page_writes = on
synchronous_commit = on
password_encryption = scram-sha-256
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = -1
log_statement = 'none'
log_lock_waits = on
deadlock_timeout = '1s'
idle_in_transaction_session_timeout = '5min'
# Application migrations choose their own reviewed lock/statement budgets.
