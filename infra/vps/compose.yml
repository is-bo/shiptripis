name: wacla

x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: '5'}
x-app: &app
  platform: linux/amd64
  image: ${APP_IMAGE:?set an immutable APP_IMAGE}
  build:
    context: ../..
    dockerfile: infra/vps/Dockerfile
  env_file: ${STACK_ENV_FILE:-./stack.env}
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    POSTGRES_HOST: postgres
    POSTGRES_PORT: '5432'
    POSTGRES_CONNECTION_LIMIT: '100'
    POSTGRES_CONNECTION_RESERVE: '15'
    PORT: '8080'
    RELEASE_ID: ${RELEASE_ID:?set reviewed release SHA}
  secrets: [app_secrets, postgres_password, redis_password]
  networks: [data, egress]
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs:
    - /tmp:uid=10001,gid=10001,mode=1770,size=256m
    - /app/staticfiles:uid=10001,gid=10001,mode=0750,size=128m
  mem_limit: 3g
  cpus: 3
  pids_limit: 512
  stop_grace_period: 40s
  logging: *logging

services:
  postgres:
    platform: linux/amd64
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    secrets: [postgres_password]
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks: [data]
    shm_size: 256m
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    restart: on-failure:5
    stop_grace_period: 60s
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" && PGPASSWORD="$$(cat /run/secrets/postgres_password)" psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Atqc "SELECT 1" | grep -qx 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    platform: linux/amd64
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    entrypoint: [/bin/sh, /etc/wacla/redis-start.sh]
    secrets: [redis_password]
    volumes:
      - redis_data:/data
      - ./redis.conf:/etc/wacla/redis.conf:ro
      - ./redis-start.sh:/etc/wacla/redis-start.sh:ro
    tmpfs: ['/run/wacla:mode=1777,size=1m']
    networks: [data]
    mem_limit: 1g
    cpus: 1
    pids_limit: 64
    restart: on-failure:5
    stop_grace_period: 60s
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -qx PONG']
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    <<: *app
    restart: on-failure:5
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, /opt/vps/runtime.py, health]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 90s

  maintenance:
    <<: *app
    profiles: [operations]
    command: [maintenance]
    restart: 'no'
    mem_limit: 1g
    cpus: 1
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  caddy:
    platform: linux/amd64
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ADMIN_CIDRS: ${ADMIN_CIDRS:?set approved Admin source CIDRs}
      WEBSOCKET_ORIGINS: ${WEBSOCKET_ORIGINS:?set HTTPS browser origins}
      # Internal upstream traffic must stay on the private bridge even when
      # the host supplies an outbound HTTP proxy (e.g. managed cloud tests).
      NO_PROXY: app,localhost,127.0.0.1,::1
      no_proxy: app,localhost,127.0.0.1,::1
    ports: ['${BIND_IP:-0.0.0.0}:80:80', '${BIND_IP:-0.0.0.0}:443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [egress]
    depends_on:
      app: {condition: service_healthy}
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    restart: on-failure:5
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, 'wget -Y off -q -O /dev/null http://127.0.0.1:8089/healthz']
      interval: 20s
      timeout: 3s
      retries: 3

  backup:
    platform: linux/amd64
    image: ${BACKUP_IMAGE:?set immutable BACKUP_IMAGE}
    build:
      context: .
      dockerfile: backup/Dockerfile
    profiles: [operations]
    env_file: ${BACKUP_ENV_FILE:-./backup.env}
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
    secrets: [postgres_password, restic_password]
    volumes: [backup_status:/status]
    tmpfs: ['/work:uid=10001,gid=10001,mode=0700,size=1m', '/tmp:size=128m']
    networks: [data, egress]
    mem_limit: 768m
    cpus: 1
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: 'no'
    logging: *logging

networks:
  data: {internal: true}
  egress: {}
volumes:
  postgres_data: {}
  redis_data: {}
  caddy_data: {}
  caddy_config: {}
  backup_status: {}
secrets:
  app_secrets: {file: '${SECRETS_DIR:?set SECRETS_DIR}/app.json'}
  postgres_password: {file: '${SECRETS_DIR}/postgres-password'}
  redis_password: {file: '${SECRETS_DIR}/redis-password'}
  restic_password: {file: '${SECRETS_DIR}/restic-password'}
