name: shiptrip
description: "ShipTrip — peer-to-peer parcel delivery between the EU and Algeria."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State + navigation
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.2

  # Network + storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  web_socket_channel: ^3.0.1

  # Formatting. Money, dates and numerals are locale-sensitive and Arabic
  # needs real numeral/date handling, not string interpolation.
  intl: any

  # Grapheme-safe string handling. Names and Arabic text must never be
  # sliced mid-character when we take initials or truncate.
  characters: ^1.4.0

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Maps. flutter_map needs no API key, which keeps V1 buildable and testable
  # before a production map provider is contracted. It sits behind
  # `core/geo/map_tile_source.dart` so swapping the tile source at release is
  # a one-file change rather than a screen rewrite.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Opening a hosted provider checkout. External application only: an
  # in-app webview for a card form is both a worse trust signal and a
  # PCI-scope problem we have no reason to take on.
  url_launcher: ^6.3.1

  # Entrance choreography. The staggered fade/rise on every ShipTrip screen is
  # part of the product's identity, not decoration; `flutter_animate` is how
  # the original expressed it and keeps the call sites declarative.
  flutter_animate: ^4.5.2

  # Flag glyphs for the DZ/FR corridor pills. Drawn as vectors, so they stay
  # crisp and carry no per-country asset.
  country_flags: ^4.1.2

  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  app_settings: ^9.0.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/

  # Bundled, not fetched. A runtime font download means a font swap on a slow
  # connection and no type at all offline — unacceptable on the corridor this
  # product serves.
  #
  # All four are variable fonts declared as a single face each; weight is
  # applied through `FontVariation('wght', …)` in `design/typography.dart`
  # alongside `fontWeight`, so the renderer picks the right instance instead
  # of synthesising a bold.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
