{% extends "admin/base_site.html" %}

{% block breadcrumbs %}<div class="breadcrumbs"><a href="{% url 'admin_console:overview' %}">Operations</a> &rsaquo; {{ title }}</div>{% endblock %}

{% block content %}
<main class="st-console st-narrow">
  <header class="st-page-head">
    <div>
      <p class="st-eyebrow">Audited action</p>
      <h1>{{ title }}</h1>
      <p>{{ description }}</p>
    </div>
  </header>
  <section class="st-card {% if danger %}st-decision-card{% endif %}">
    <form method="post" class="st-form">{% csrf_token %}
      {{ form.as_p }}
      <div class="st-split-actions">
        <a class="button st-button-quiet" href="{{ back_url }}">Cancel</a>
        <span class="st-spacer"></span>
        <button{% if danger %} class="st-button-danger"{% endif %} type="submit">{{ submit_label }}</button>
      </div>
    </form>
  </section>
</main>
{% endblock %}
