// ShipTrip KYC sync contract.
//
// Per CLAUDE.md §1 + ARCHITECTURE.md §6: KYC submission is a two-phase
// flow that the Go kyc-service drives and the Django monolith ratifies.
//
//   1. Flutter posts a multipart to the Go kyc-service.
//   2. kyc-service streams the document images to MinIO/S3 under
//      `kyc-docs/<user_id>/<uuid>.<ext>`.
//   3. kyc-service calls Django (this service) with the image keys plus
//      a Flutter-generated idempotency key, so retries on flaky mobile
//      networks are no-ops.
//   4. Django INSERTs (ON CONFLICT idempotency_key DO NOTHING) and
//      returns the submission id.
//
// The bytes never traverse this RPC; only metadata. That keeps message
// size well under the 16 MB grpc limit configured per ARCH §6.
//
// Channel security: mTLS in production (ARCH §6 "mTLS, not static
// bearer"). Static bearer is permitted only in docker-compose dev.
//
// File ownership: jointly owned. Either Claude regenerates stubs after
// changes — Go via the protoc target in backend/Taskfile.yml, Django via
// `python -m grpc_tools.protoc` (CLAUDE.md §1).

syntax = "proto3";

package shiptrip.kyc.v1;

option go_package = "shiptrip/internal/kyc/kycpb;kycpb";

// DocumentType mirrors apps/kyc/models.py KycSubmission.DocumentType.
// Adding a value here REQUIRES a matching Django enum change.
enum DocumentType {
  DOCUMENT_TYPE_UNSPECIFIED = 0;
  DOCUMENT_TYPE_ID_CARD = 1;
  DOCUMENT_TYPE_PASSPORT = 2;
  DOCUMENT_TYPE_DRIVING_LICENSE = 3;
}

// Status mirrors apps/kyc/models.py KycSubmission.Status. Django is the
// only writer of status; kyc-service reads it for the /api/v1/kyc/me
// endpoint and via the kyc.status_changed Redis channel.
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_PENDING = 1;
  STATUS_APPROVED = 2;
  STATUS_REJECTED = 3;
  STATUS_EXPIRED = 4;
}

// RecordSubmissionRequest is the metadata Django needs to durably create
// (or reuse, via idempotency_key) a kyc_submission row.
//
// `idempotency_key` is generated by Flutter (UUID v4 hex). It MUST be
// stable across retries of the same logical submission — Flutter caches
// it locally until the request succeeds.
message RecordSubmissionRequest {
  int64 user_id = 1;
  DocumentType document_type = 2;
  string idempotency_key = 3;

  // S3/MinIO object keys. The bytes are already uploaded; Django only
  // records references. back_image_key and selfie_image_key are optional
  // (passport submissions have no back side, etc.).
  string front_image_key = 4;
  string back_image_key = 5;
  string selfie_image_key = 6;
}

// RecordSubmissionResponse always returns the submission id — either the
// freshly inserted row's id, or the existing row's id on idempotent
// retry. `created` distinguishes the two so kyc-service can surface a
// 201 vs 200 to the client.
message RecordSubmissionResponse {
  int64 submission_id = 1;
  bool created = 2;
  Status status = 3;
}

service KYCSubmissionService {
  rpc RecordSubmission(RecordSubmissionRequest) returns (RecordSubmissionResponse);
}
