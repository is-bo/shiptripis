# =============================================================================
# ShipTrip dev compose. Bring up Postgres + Redis + MinIO first; Django and
# Caddy come online after. Go services live in backend/services and join
# this network when Claude B brings them up.
# =============================================================================
name: shiptrip

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      # Host 6380 -> container 6379. Native redis-server in WSL holds 6379.
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6

  # One-shot bucket provisioning. App code must NOT create buckets (CLAUDE.md
  # §G4: "Never call MinIO admin APIs from app code"), so the kyc-service's
  # /readyz HeadBucket check stays red until these exist. mc runs, makes the
  # buckets idempotently (`mb -p` no-ops if present), then exits 0. Keep bucket
  # names in sync with KYC_S3_BUCKET (kyc-service) + S3_BUCKET_* (Django).
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" &&
        mc mb -p local/kyc-docs local/shiptrip-parcel &&
        echo "buckets ready"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}

  # Local SMTP sink for the email-service. Captures every outbound mail instead
  # of delivering it, so signup/reset OTPs are readable in the web UI at
  # http://localhost:8026 without configuring a real relay (and without any
  # risk of mailing a real address from a dev box).
  #
  # Dev only — never deployed. Production sets EMAIL_SMTP_HOST/PORT to a real
  # relay (Brevo/Mailgun/…) with EMAIL_USE_TLS=true + auth. Ports are 1026/8026
  # on the host to avoid colliding with anything already on 1025/8025; inside
  # the compose network the email-service still talks to `mailhog:1025`.
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1026:1025" # SMTP
      - "8026:8025" # web UI
    healthcheck:
      # The image has no curl/wget, but it does ship nc — check the SMTP port
      # is accepting connections rather than assuming the container is ready.
      test: ["CMD", "nc", "-z", "localhost", "1025"]
      interval: 10s
      timeout: 3s
      retries: 6

  django:
    build:
      context: ./monolith
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Pin settings module here; everything else comes from .env.
      DJANGO_SETTINGS_MODULE: config.settings.dev
    ports:
      - "8000:8000"
    volumes:
      - ./monolith:/app:cached
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  # KYC gRPC server (Django side). The `django` service above only runs the
  # HTTP dev server, so without this the 50051 port was mapped but nothing
  # listened — the Go kyc-service's RecordSubmission dial would hang. Same
  # image + code, different entrypoint. Dev auth is bearer (CLAUDE.md §G5);
  # GRPC_AUTH_MODE + GRPC_BEARER_TOKEN come from .env, shared with kyc-service.
  django-grpc:
    build:
      context: ./monolith
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    ports:
      - "50051:50051"
    volumes:
      - ./monolith:/app:cached
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "manage.py", "runkycgrpc", "--addr", "0.0.0.0:50051"]

  # ── Go services (backend/services) ──────────────────────────────────────
  # All three share one parameterized Dockerfile (SERVICE build-arg picks the
  # cmd/<SERVICE> binary). They read the SAME .env as Django — pkg/config
  # accepts Django's split POSTGRES_*/REDIS_URL/JWT_HS256_SECRET/S3_* vars, so
  # no Go-only DATABASE_URL is needed. Inside the compose network they reach
  # postgres:5432 and redis:6379 (NOT the host's 6380 remap). Per-service
  # _DB_MAX_CONNS defaults live in each main.go and honour the §3 pool budget;
  # override here only when scaling pod count.
  #
  # Required in .env for these to boot (fail-loud at startup if missing):
  #   POSTGRES_HOST=postgres  POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD
  #   REDIS_URL=redis://redis:6379/0
  #   JWT_HS256_SECRET=<same secret Django signs with>
  #   S3_ENDPOINT_URL=http://minio:9000  S3_ACCESS_KEY / S3_SECRET_KEY
  #   KYC_GRPC_TARGET=django-grpc:50051  GRPC_AUTH_MODE=bearer  GRPC_BEARER_TOKEN=<shared>

  kyc-service:
    build:
      context: ./services
      dockerfile: Dockerfile
    env_file: .env
    # The kyc-service forces an eager gRPC connection at boot (fail-fast on a
    # bad KYC_GRPC_TARGET, by design — cmd/kyc/main.go). On a cold `up` the
    # django-grpc server may not have bound :50051 within the 10s dial window,
    # so the first boot can lose the race and exit. on-failure self-heals that
    # transient race; a genuinely wrong target keeps crash-looping (visible).
    restart: on-failure
    environment:
      SHIPTRIP_SERVICE: "kyc"
      KYC_HTTP_ADDR: ":8083"
      KYC_GRPC_TARGET: "django-grpc:50051"
      KYC_S3_BUCKET: "kyc-docs"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      django-grpc:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  notification-service:
    build:
      context: ./services
      dockerfile: Dockerfile
    env_file: .env
    environment:
      SHIPTRIP_SERVICE: "notification"
      NOTIF_HTTP_ADDR: ":8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  chat-service:
    build:
      context: ./services
      dockerfile: Dockerfile
    env_file: .env
    environment:
      SHIPTRIP_SERVICE: "chat"
      CHAT_HTTP_ADDR: ":8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  # Email/SMTP sender. Pure stream consumer (no Postgres, no public route) —
  # drains the durable `email:send` stream Django XADDs onto and sends over SMTP.
  # Django's publisher landed 2026-07-27 (enqueue_email_after_commit), so this
  # only needs EMAIL_ENABLED=true + the EMAIL_SMTP_* vars to go live; with the
  # mailhog defaults in .env.example that works out of the box locally. While
  # disabled it still boots and serves /healthz, so it sits here harmlessly.
  email-service:
    build:
      context: ./services
      dockerfile: Dockerfile
    env_file: .env
    environment:
      SHIPTRIP_SERVICE: "email"
      EMAIL_HTTP_ADDR: ":8085"
    depends_on:
	  postgres:
		condition: service_healthy
      redis:
        condition: service_healthy
      # Dev convenience: with EMAIL_SMTP_HOST=mailhog the first send would fail
      # (and sit in the PEL until the sweeper retried) if mailhog were not up
      # yet. Harmless when pointing at a real relay — the dependency just
      # resolves immediately since mailhog still starts.
      mailhog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web:/srv/shiptrip-web:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - django
      - kyc-service
      - notification-service
      - chat-service
      - email-service

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
