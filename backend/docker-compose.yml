# =============================================================================
# ShipTrip dev compose. Bring up Postgres + Redis + MinIO first; Django and
# Caddy come online after. Go services live in backend/services and join
# this network when Claude B brings them up.
# =============================================================================
name: shiptrip

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      # Host 6380 -> container 6379. Native redis-server in WSL holds 6379.
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6

  django:
    build:
      context: ./monolith
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Pin settings module here; everything else comes from .env.
      DJANGO_SETTINGS_MODULE: config.settings.dev
    ports:
      - "8000:8000"
      - "50051:50051"
    volumes:
      - ./monolith:/app:cached
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  notification:
    build:
      context: ./services
      dockerfile: Dockerfile.notification
    environment:
      # Per-pod budget (CLAUDE.md §3): notif gets 10 conns.
      NOTIF_DB_MAX_CONNS: "10"
      NOTIF_HTTP_ADDR: ":8082"
      # Reuse Django's split Postgres vars; pkg/config builds the URL.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      JWT_HS256_SECRET: ${JWT_HS256_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # FCM stays gated until fcm_token schema + Django publisher land.
      FCM_ENABLED: "false"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - django
      - notification

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
