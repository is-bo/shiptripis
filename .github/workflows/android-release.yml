name: Build Android

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: HTTPS base URL of the deployed ShipTrip gateway
        required: true
        type: string
      build_type:
        description: Signed release is the pre-launch artifact; profile is the private device-performance build; debug is the install-only fallback
        required: true
        default: release
        type: choice
        options:
          - release
          - profile
          - debug
      apk_architecture:
        description: ARM64 is the smaller private phone-test APK; universal also includes 32-bit ARM and x64
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - universal
      release_id:
        description: Optional label (for example v1.0.0-rc.1); defaults from the pubspec version/build
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}-${{ inputs.build_type }}-${{ inputs.apk_architecture }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Validate public build configuration and derive artifact names
        id: metadata
        env:
          INPUT_API_BASE_URL: ${{ inputs.api_base_url }}
          INPUT_BUILD_TYPE: ${{ inputs.build_type }}
          INPUT_APK_ARCHITECTURE: ${{ inputs.apk_architecture }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          INPUT_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          INPUT_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          INPUT_FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
        run: |
          python - <<'PY'
          import os
          import ipaddress
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          api_base_url = os.environ["INPUT_API_BASE_URL"].strip()
          build_type = os.environ["INPUT_BUILD_TYPE"]
          apk_architecture = os.environ["INPUT_APK_ARCHITECTURE"]
          parsed = urlsplit(api_base_url)
          try:
              parsed.port
          except ValueError as exc:
              raise SystemExit("api_base_url has an invalid port") from exc
          hostname = parsed.hostname or ""
          try:
              ipaddress.ip_address(hostname)
              valid_host = True
          except ValueError:
              labels = hostname.rstrip(".").split(".")
              valid_host = bool(hostname) and all(
                  1 <= len(label) <= 63
                  and label[0].isalnum()
                  and label[-1].isalnum()
                  and all(character.isalnum() or character == "-" for character in label)
                  for label in labels
              )
          if (
              parsed.scheme != "https"
              or not valid_host
              or parsed.username is not None
              or parsed.password is not None
              or parsed.path not in ("", "/")
              or parsed.query
              or parsed.fragment
          ):
              raise SystemExit(
                  "api_base_url must be a credential-free HTTPS origin"
              )

          firebase_values = {
              "FIREBASE_API_KEY": os.environ.get("INPUT_FIREBASE_API_KEY", "").strip(),
              "FIREBASE_PROJECT_ID": os.environ.get("INPUT_FIREBASE_PROJECT_ID", "").strip(),
              "FIREBASE_MESSAGING_SENDER_ID": os.environ.get("INPUT_FIREBASE_MESSAGING_SENDER_ID", "").strip(),
              "FIREBASE_ANDROID_APP_ID": os.environ.get("INPUT_FIREBASE_ANDROID_APP_ID", "").strip(),
          }
          configured = [name for name, value in firebase_values.items() if value]
          if configured and len(configured) != len(firebase_values):
              missing = sorted(set(firebase_values) - set(configured))
              raise SystemExit(
                  "Firebase client configuration must be all-or-none; missing "
                  + ", ".join(missing)
              )
          # Say, in the run log, whether this artifact can do push at all.
          # An all-absent tuple is a legitimate state (push stays unavailable
          # and the rest of the app works), and it is indistinguishable from a
          # complete one everywhere else in this job — which is how a
          # push-dead QA build gets handed to a tester as a push build. These
          # are the public Firebase *client* identifiers that ship inside every
          # APK; the Admin service-account credential is never here.
          if configured:
              print(
                  "Firebase client configuration: complete"
                  f" (project {firebase_values['FIREBASE_PROJECT_ID']},"
                  f" sender {firebase_values['FIREBASE_MESSAGING_SENDER_ID']},"
                  f" android app {firebase_values['FIREBASE_ANDROID_APP_ID']},"
                  f" api key {firebase_values['FIREBASE_API_KEY'][:6]}..."
                  f"[{len(firebase_values['FIREBASE_API_KEY'])} chars])"
              )
          else:
              print(
                  "Firebase client configuration: absent - this build keeps "
                  "push unavailable"
              )

          pubspec = Path("pubspec.yaml").read_text(encoding="utf-8")
          version_match = re.search(r"(?m)^version:\s*([^+\s]+)(?:\+([^\s]+))?\s*$", pubspec)
          if version_match is None:
              raise SystemExit("mobile/pubspec.yaml has no parseable version")
          version = version_match.group(1)
          build_number = version_match.group(2)

          release_id = os.environ.get("INPUT_RELEASE_ID", "").strip()
          if not release_id:
              release_id = f"v{version}"
              if build_number:
                  release_id += f"-build.{build_number}"
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,63}", release_id):
              raise SystemExit(
                  "release_id must be 1-64 characters using only letters, digits, dot, underscore, or hyphen"
              )

          short_sha = os.environ["GITHUB_SHA"][:7]
          stem = f"shiptrip-{release_id}-{short_sha}-{build_type}-{apk_architecture}"
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"api_base_url={api_base_url.rstrip('/')}\n")
              handle.write(f"artifact_name={stem}\n")
              handle.write(f"file_stem={stem}\n")
          PY

      - name: Decode temporary release keystore
        id: signing
        if: inputs.build_type == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing required GitHub Secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/shiptrip-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK and AAB
        if: inputs.build_type == 'release'
        env:
          API_BASE_URL: ${{ steps.metadata.outputs.api_base_url }}
          APK_ARCHITECTURE: ${{ inputs.apk_architecture }}
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
        run: |
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Secret: $name"
              exit 1
            fi
          done
          apk_target=()
          if [ "$APK_ARCHITECTURE" = "arm64" ]; then
            apk_target+=(--target-platform android-arm64)
          fi
          firebase_args=(
            "--dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY"
            "--dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
            "--dart-define=FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID"
            "--dart-define=FIREBASE_ANDROID_APP_ID=$FIREBASE_ANDROID_APP_ID"
          )
          flutter build apk --release "${apk_target[@]}" "${firebase_args[@]}" "--dart-define=API_BASE_URL=$API_BASE_URL"
          flutter build appbundle --release "${firebase_args[@]}" "--dart-define=API_BASE_URL=$API_BASE_URL"

      # PRIVATE PROFILE ARM64 — a device-performance artifact, never a
      # distributable one. Profile is Flutter's measurement mode: Dart is
      # AOT-compiled exactly as in release, the JIT engine and the Vulkan
      # validation layer are gone, and only the tracing hooks a profiler needs
      # remain. The Flutter Gradle plugin creates the `profile` build type with
      # `initWith(debug)`, so it carries the runner's local Android debug
      # signing config and installs without any release key. The release build
      # type is untouched and still refuses to build without all four signing
      # secrets.
      - name: Build private profile APK
        if: inputs.build_type == 'profile'
        env:
          API_BASE_URL: ${{ steps.metadata.outputs.api_base_url }}
          APK_ARCHITECTURE: ${{ inputs.apk_architecture }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
        run: |
          apk_target=()
          if [ "$APK_ARCHITECTURE" = "arm64" ]; then
            apk_target+=(--target-platform android-arm64)
          fi
          firebase_args=(
            "--dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY"
            "--dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
            "--dart-define=FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID"
            "--dart-define=FIREBASE_ANDROID_APP_ID=$FIREBASE_ANDROID_APP_ID"
          )
          flutter build apk --profile "${apk_target[@]}" "${firebase_args[@]}" "--dart-define=API_BASE_URL=$API_BASE_URL"

      - name: Build debug fallback APK
        if: inputs.build_type == 'debug'
        env:
          API_BASE_URL: ${{ steps.metadata.outputs.api_base_url }}
          APK_ARCHITECTURE: ${{ inputs.apk_architecture }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
        run: |
          apk_target=()
          if [ "$APK_ARCHITECTURE" = "arm64" ]; then
            apk_target+=(--target-platform android-arm64)
          fi
          firebase_args=(
            "--dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY"
            "--dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
            "--dart-define=FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID"
            "--dart-define=FIREBASE_ANDROID_APP_ID=$FIREBASE_ANDROID_APP_ID"
          )
          flutter build apk --debug "${apk_target[@]}" "${firebase_args[@]}" "--dart-define=API_BASE_URL=$API_BASE_URL"

      - name: Verify signatures and stage artifacts
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          FILE_STEM: ${{ steps.metadata.outputs.file_stem }}
        run: |
          set -euo pipefail
          mkdir -p build/android-artifacts
          if [ "$BUILD_TYPE" = "release" ]; then
            apk_source=build/app/outputs/flutter-apk/app-release.apk
            aab_source=build/app/outputs/bundle/release/app-release.aab
            apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
            test -n "$apksigner"
            "$apksigner" verify "$apk_source"
            verify_output="$(jarsigner -verify -verbose -certs "$aab_source" 2>&1)"
            if ! grep -q '^jar verified\.$' <<<"$verify_output"; then
              echo "::error::Android App Bundle signature verification failed"
              exit 1
            fi
            cp "$apk_source" "build/android-artifacts/$FILE_STEM.apk"
            cp "$aab_source" "build/android-artifacts/$FILE_STEM.aab"
          elif [ "$BUILD_TYPE" = "profile" ]; then
            apk_source=build/app/outputs/flutter-apk/app-profile.apk
            # Prove the artifact is profile before it leaves the runner: AOT
            # code present, and the two debug-only payloads absent. A debug APK
            # fails all three checks.
            entries="$(unzip -Z1 "$apk_source")"
            if ! grep -Eq '^lib/[^/]+/libapp\.so$' <<<"$entries"; then
              echo "::error::No AOT libapp.so — this is not a profile build"
              exit 1
            fi
            if grep -q 'kernel_blob.bin' <<<"$entries"; then
              echo "::error::Dart kernel blob present — this is a debug build"
              exit 1
            fi
            if grep -q 'libVkLayer' <<<"$entries"; then
              echo "::error::Vulkan validation layer present — this is a debug build"
              exit 1
            fi
            # Installability requires a signature. Profile carries the local
            # debug signing config; it is not, and cannot become, the release
            # key.
            apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
            test -n "$apksigner"
            "$apksigner" verify "$apk_source"
            cp "$apk_source" "build/android-artifacts/$FILE_STEM.apk"
          else
            apk_source=build/app/outputs/flutter-apk/app-debug.apk
            cp "$apk_source" "build/android-artifacts/$FILE_STEM.apk"
          fi
          cd build/android-artifacts
          sha256sum * > SHA256SUMS.txt

      - name: Remove temporary signing material
        if: always() && inputs.build_type == 'release'
        run: rm -f "$RUNNER_TEMP/shiptrip-release.jks"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: mobile/build/android-artifacts/
          if-no-files-found: error
          retention-days: 30
