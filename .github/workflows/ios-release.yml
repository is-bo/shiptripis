name: Build iOS

# Manual only: a signed App Store build is made when Ismail asks for one, never
# on a push or a pull request. The IPA is kept as a workflow artifact; it goes
# to TestFlight only when `upload_to_testflight` is ticked and the App Store
# Connect API key secrets exist. Secrets: docs/WASSLA_SETUP_FOR_ISMAIL.md.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: HTTPS base URL of the deployed Wassla gateway
        required: true
        type: string
      build_number:
        description: Optional App Store build number (a whole number higher than the last upload); defaults to the pubspec build
        required: false
        type: string
      release_id:
        description: Optional label (for example v1.0.0-rc.1); defaults from the pubspec version/build
        required: false
        type: string
      upload_to_testflight:
        description: Also upload the IPA to App Store Connect (TestFlight); needs the App Store Connect API key secrets
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: iOS configuration
        working-directory: .
        run: python3 tools/check_ios_config.py

      - name: Validate public build configuration and derive artifact names
        id: metadata
        env:
          INPUT_API_BASE_URL: ${{ inputs.api_base_url }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          INPUT_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          INPUT_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          INPUT_FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
        run: python3 ../tools/mobile_release_config.py ios

      # Checked before the long build, so a missing secret fails in seconds.
      - name: Check signing and upload secrets
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
        run: |
          set -euo pipefail
          required=(IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_TEAM_ID)
          if [ "$UPLOAD_TO_TESTFLIGHT" = "true" ]; then
            required+=(APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64)
          fi
          status=0
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Secret: $name"
              status=1
            fi
          done
          exit $status

      - name: Install temporary signing keychain and provisioning profile
        id: signing
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          bundle_id=eu.wassla.app
          keychain="$RUNNER_TEMP/wassla-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/wassla-distribution.p12"
          profile="$RUNNER_TEMP/wassla-appstore.mobileprovision"
          profile_plist="$RUNNER_TEMP/wassla-appstore-profile.plist"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security import "$certificate" -k "$keychain" -f pkcs12 \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
          security cms -D -i "$profile" > "$profile_plist"
          read_profile() { /usr/libexec/PlistBuddy -c "Print :$1" "$profile_plist"; }
          uuid="$(read_profile UUID)"
          team="$(read_profile TeamIdentifier:0)"
          app_id="$(read_profile Entitlements:application-identifier)"
          push="$(read_profile Entitlements:aps-environment 2>/dev/null || true)"
          if [ "$team" != "$IOS_TEAM_ID" ] || [ "$app_id" != "$IOS_TEAM_ID.$bundle_id" ]; then
            echo "::error::The provisioning profile is for $app_id, not $IOS_TEAM_ID.$bundle_id"
            exit 1
          fi
          if read_profile ProvisionedDevices > /dev/null 2>&1; then
            echo "::error::The provisioning profile lists devices: use an App Store distribution profile"
            exit 1
          fi
          if [ "$push" != "production" ]; then
            echo "::error::The provisioning profile has no production push entitlement: enable Push Notifications on the App ID and regenerate the profile"
            exit 1
          fi
          for folder in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                        "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$folder"
            cp "$profile" "$folder/$uuid.mobileprovision"
          done

          # Manual signing for the Runner only, on this runner only: the
          # settings go into the Runner's own release configuration file, so
          # plugin targets keep signing nothing.
          cat >> ios/Flutter/Release.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $IOS_TEAM_ID
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = $uuid
          EOF

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>$IOS_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$bundle_id</key>
              <string>$uuid</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          echo "export_options=$RUNNER_TEMP/ExportOptions.plist" >> "$GITHUB_OUTPUT"

      - name: Build signed App Store IPA
        env:
          API_BASE_URL: ${{ steps.metadata.outputs.api_base_url }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          EXPORT_OPTIONS: ${{ steps.signing.outputs.export_options }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
          # Empty until Google and Apple sign-in are set up; the buttons stay
          # hidden then. The "Check sign-in settings" build phase refuses a
          # build whose defines disagree with ios/Flutter/SocialSignIn.xcconfig.
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
          APPLE_SIGN_IN_ENABLED: ${{ vars.APPLE_SIGN_IN_ENABLED }}
        run: |
          set -euo pipefail
          build_args=(--release "--export-options-plist=$EXPORT_OPTIONS")
          if [ -n "$BUILD_NUMBER" ]; then
            build_args+=("--build-number=$BUILD_NUMBER")
          fi
          flutter build ipa "${build_args[@]}" \
            "--dart-define=API_BASE_URL=$API_BASE_URL" \
            "--dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY" \
            "--dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" \
            "--dart-define=FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID" \
            "--dart-define=FIREBASE_IOS_APP_ID=$FIREBASE_IOS_APP_ID" \
            "--dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID" \
            "--dart-define=GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID" \
            "--dart-define=APPLE_SIGN_IN_ENABLED=${APPLE_SIGN_IN_ENABLED:-false}"

      - name: Verify signature and stage artifacts
        id: artifacts
        env:
          FILE_STEM: ${{ steps.metadata.outputs.file_stem }}
        run: |
          set -euo pipefail
          ipa="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | head -1)"
          test -n "$ipa"
          unpacked="$RUNNER_TEMP/wassla-ipa"
          rm -rf "$unpacked"
          unzip -q "$ipa" -d "$unpacked"
          app="$(find "$unpacked/Payload" -maxdepth 1 -name '*.app' | head -1)"
          codesign --verify --deep --strict "$app"
          entitlements="$(codesign -d --entitlements - --xml "$app" 2>/dev/null | plutil -convert xml1 -o - -)"
          if ! grep -A1 '<key>aps-environment</key>' <<<"$entitlements" | grep -q '<string>production</string>'; then
            echo "::error::The signed app does not carry the production push entitlement"
            exit 1
          fi
          mkdir -p build/ios-artifacts
          cp "$ipa" "build/ios-artifacts/$FILE_STEM.ipa"
          cd build/ios-artifacts
          shasum -a 256 * > SHA256SUMS.txt
          echo "ipa=$PWD/$FILE_STEM.ipa" >> "$GITHUB_OUTPUT"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: mobile/build/ios-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload to TestFlight
        if: inputs.upload_to_testflight
        env:
          IPA: ${{ steps.artifacts.outputs.ipa }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          keys="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$keys"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode \
            > "$keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          chmod 600 "$keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/wassla-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/wassla-distribution.p12" \
                "$RUNNER_TEMP/wassla-appstore.mobileprovision" \
                "$RUNNER_TEMP/wassla-appstore-profile.plist" \
                "$RUNNER_TEMP/ExportOptions.plist"
          rm -rf "$HOME/.appstoreconnect/private_keys" \
                 "$HOME/Library/MobileDevice/Provisioning Profiles" \
                 "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
